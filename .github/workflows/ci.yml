name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: |
          dart format lib test
          git diff --check
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
