name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format sources for verification
        run: |
          dart format lib test
          git diff --check
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            lib/src/calculator_page.dart
            lib/src/effect_overlay.dart
            test/calculator_engine_test.dart
      - name: Verify no formatter diff
        run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
