name: format main Dart sources

on:
  push:
    branches:
      - chore/format-main-dart

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/format-main-dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply Dart formatter to main sources"
          git push origin HEAD:chore/format-main-dart
